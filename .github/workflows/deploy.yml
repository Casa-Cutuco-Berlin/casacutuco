name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      statuses: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Node.js version
        run: node --version
      
      - name: Install dependencies
        working-directory: casa-cutuco-v10
        run: npm ci
      
      - name: Build project
        working-directory: casa-cutuco-v10
        run: npm run build
      
      - name: Notify Vercel
        if: github.event_name == 'push'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - casa-cutuco-v10: jsoriano1045/casacutuco'
